<style>

e:12px;color:var(--muted);font-weight:650}td.num,th.num{text-align:right;white-space:nowrap}td small{display:block;margin-top:4px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.toolbar label{flex:1;min-width:170px;max-width:320px}label{display:flex;flex-direction:column;gap:5px;min-width:0}input,select{padding:10px;border:1px solid #ccd7e5;border-radius:8px;background:#fff;color:var(--ink);min-width:0;width:100%}details{margin:8px 0}summary{cursor:pointer;color:var(--blue);line-height:1.5}details p{margin:8px 0;font-size:14px}dl{display:grid;grid-template-columns:minmax(160px,1fr) minmax(100px,1fr);gap:12px;margin:12px 0}dt{color:var(--muted)}dd{margin:0;text-align:right}section[hidden],[hidden]{display:none!important}.meter{height:8px;background:#edf1f6;border-radius:6px;overflow:hidden;margin:6px 0 16px}.meter span{display:block;height:100%;background:#4c73ab}.source{font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;max-width:560px;width:calc(100% - 32px);padding:24px;color:var(--ink)}dialog::backdrop{background:#13223877}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}#message{font-size:14px;max-width:340px}.category{font-size:12px;padding:5px 8px;text-align:left}#storageWarning{margin:0 auto;max-width:1232px}.empty{padding:18px;color:var(--muted)}.checks td{font-size:13px}.finding{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}.allocation{display:grid;grid-template-columns:minmax(100px,1fr) minmax(130px,1fr);gap:12px;align-items:center}.allocation strong{text-align:right}.footer{padding:12px 0 22px;font-size:12px;color:var(--muted)}

<header><div><h1>Finanças da Família</h1><small>Meus dados · conta até 15/10/2026 · investimentos em 14/10/2026</small></div><div><button onclick="exportBackup()">Salvar cópia</button> <button onclick="document.getElementById('backupFile').click()">Carregar cópia</button><input id="backupFile" type="file" accept=".json,application/json" hidden><div id="message" role="status" aria-live="polite"></div></div></header>
